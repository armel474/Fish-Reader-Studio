<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishReader — Bulle flottante</title>
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/fonts.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/colors.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/typography.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/spacing.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/components/components.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/styles.css">
<style>
html,body{margin:0;min-height:100%;background:var(--paper)}
body{font-family:var(--font-sans)}
a{color:var(--accent)}a:hover{color:var(--ink)}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.m{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);position:relative;overflow:hidden}
.m-lbl{display:flex;align-items:baseline;justify-content:space-between;font:600 12px/18px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.m-num,.b-tab{font-variant-numeric:tabular-nums}
.m-num{font:600 14px/20px var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink)}
.m-full{width:100%}
.m .fr-btn--lg{min-height:48px}
.m .fr-btn{transition:background-color .15s,color .15s}
.m .fr-btn:active,.m .fr-iconbtn:active,.m .fr-play:active,.m .fr-chip:active{transform:translateY(1px)}
.m-seg5 .fr-seg{display:grid;grid-template-columns:repeat(5,1fr);width:100%;box-sizing:border-box}
.m .fr-seg button{min-height:44px;padding:0 2px;font-variant-numeric:tabular-nums;transition:background-color .15s,color .15s}
.m .fr-seg button:hover{color:var(--ink)}
.m-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m .fr-chip{min-height:44px;transition:background-color .15s,color .15s}
.m .fr-chip:hover{background:var(--paper)}
.m .fr-chip[aria-pressed="true"]:hover{background:var(--ink)}
.m-quick-row{display:flex;align-items:center;gap:12px}
.m-quick-txt{flex:1;min-width:0}
.m-quick-title{margin:0;font:600 15px/22px var(--font-sans)}
.m-caption{margin:0;font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.m-switch{width:56px;height:44px;flex:none;display:grid;place-items:center;border:0;padding:0;background:transparent;cursor:pointer;border-radius:999px}
.m-switch-track{position:relative;width:52px;height:32px;border-radius:999px;border:1px solid var(--ink-muted);background:var(--paper);box-sizing:border-box;transition:background-color .15s,border-color .15s}
.m-switch-knob{position:absolute;top:50%;left:6px;width:18px;height:18px;margin-top:-9px;border-radius:999px;background:var(--ink-muted);transition:left .15s,width .15s,height .15s,margin .15s,background-color .15s}
.m-switch[aria-checked="true"] .m-switch-track{background:var(--accent);border-color:var(--accent)}
.m-switch[aria-checked="true"] .m-switch-knob{left:24px;width:22px;height:22px;margin-top:-11px;background:var(--on-accent)}
.m-mini-head{display:flex;align-items:center;gap:12px}
.m-mini-txt{flex:1;min-width:0}
.m-line{height:3px;background:var(--rule);border-radius:999px;overflow:hidden;margin:4px 0}
.m-line>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.m-transport{flex:1;display:grid;grid-template-columns:56px 1fr 64px;align-items:center;gap:4px}
.m-transport-mid{display:flex;align-items:center;justify-content:center;gap:8px}
.m-time{font:400 13px/18px var(--font-sans);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.m-speed{justify-self:end;min-width:64px;min-height:44px;border-radius:var(--radius-md);border:1px solid var(--ink-muted);background:var(--paper-raised);color:var(--ink);font:600 14px/20px var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .15s}
.m-speed:hover{background:var(--paper)}
.m-speed:active{transform:translateY(1px)}

.b-area{position:relative;flex:1;min-height:0;overflow:hidden}
.b-host{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--paper-raised);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.b-host-bar{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--rule)}
.b-host-app{font-weight:700;font-size:15px}
.b-host-url{flex:1;min-width:0;min-height:32px;display:flex;align-items:center;padding:0 12px;border-radius:999px;background:var(--paper);color:var(--ink-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-host-scroll{flex:1;min-height:0;overflow:auto;padding:20px 20px 260px;scrollbar-width:none}
.b-host-kicker{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.b-host-title{margin:0 0 8px;font-size:24px;line-height:30px;font-weight:700;text-wrap:pretty}
.b-host-meta{margin:0 0 20px;font-size:13px;color:var(--ink-muted)}
.b-host-p{margin:0 0 18px;font-size:16px;line-height:25px}
.b-sent{border-radius:4px;transition:background-color .25s,box-shadow .25s}
.b-sent.is-active{background:var(--highlight);box-shadow:0 0 0 3px var(--highlight)}
.b-host.is-pick .b-sent{cursor:pointer;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.b-host.is-pick .b-sent:hover{background:var(--highlight);box-shadow:0 0 0 3px var(--highlight)}
.b-host.is-scan .b-block{box-shadow:0 0 0 1px var(--accent);border-radius:4px}
.b-scanline{position:absolute;left:0;right:0;top:52px;height:2px;background:var(--accent);animation:b-scan 1.5s linear forwards}
@keyframes b-scan{from{top:52px}to{top:100%}}

.b-bubble{position:absolute;z-index:3;width:56px;height:56px;padding:0;border:0;background:transparent;cursor:grab;touch-action:none;display:grid;place-items:center;transition:left .25s,right .25s,top .25s,width .25s}
.b-bubble-face{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);box-shadow:0 0 0 3px var(--paper-raised);transition:width .25s,height .25s,border-radius .25s}
.b-bubble:hover .b-bubble-face{filter:brightness(1.08)}
.b-bubble.is-drag{cursor:grabbing}
.b-bubble.is-drag .b-bubble-face{box-shadow:0 0 0 3px var(--highlight)}
.b-bubble.is-tucked{width:44px;height:72px}
.b-bubble.is-tucked .b-bubble-face{width:14px;height:64px;color:transparent;overflow:hidden}
.b-bubble.is-tucked.b-side-right{justify-items:end}
.b-bubble.is-tucked.b-side-right .b-bubble-face{border-radius:999px 0 0 999px}
.b-bubble.is-tucked.b-side-left{justify-items:start}
.b-bubble.is-tucked.b-side-left .b-bubble-face{border-radius:0 999px 999px 0}
.b-trash{position:absolute;z-index:2;left:50%;bottom:24px;width:80px;height:80px;margin-left:-40px;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--paper);border:1px solid var(--ink-muted);color:var(--ink);font:600 12px/16px var(--font-sans);transition:background-color .15s,color .15s}
.b-trash.is-over{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}

.b-idlepill{position:absolute;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);min-height:44px;display:flex;align-items:center;gap:8px;padding:0 18px 0 14px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 14px/20px var(--font-sans);cursor:pointer;box-shadow:0 0 0 3px var(--paper-raised)}
.b-idlepill:hover{filter:brightness(1.08)}
.b-idlepill:active{transform:translateX(-50%) translateY(1px)}

.b-outside{position:absolute;inset:0;z-index:3;border:0;padding:0;background:transparent;cursor:default}
.b-outside:focus-visible{outline:none}
.b-sheet{position:absolute;z-index:4;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:12px;padding:8px 16px 12px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-lg)}
.b-sheet-head{display:flex;align-items:center;gap:8px;margin-right:-8px}
.b-wordmark{font:600 18px/24px var(--font-serif)}
.b-grow{flex:1}
.b-sheet-main{display:flex;flex-direction:column;gap:8px}
.b-sep{height:1px;background:var(--rule)}

.b-pill{position:absolute;z-index:3;left:50%;bottom:12px;transform:translateX(-50%);width:calc(100% - 32px);max-width:360px;box-sizing:border-box;min-height:64px;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--paper);border:1px solid var(--rule);border-radius:999px}
.b-pill-open{flex:1;min-width:0;min-height:48px;display:flex;align-items:center;gap:12px;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer;border-radius:999px}
.b-pill-txt{display:flex;flex-direction:column;min-width:0}
.b-pill-txt b{font:600 14px/20px var(--font-sans)}
.b-pill-txt span{font:400 13px/18px var(--font-sans);color:var(--ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-spin{width:22px;height:22px;flex:none;border-radius:999px;border:2px solid var(--rule);border-top-color:var(--accent);animation:b-rot .9s linear infinite}
@keyframes b-rot{to{transform:rotate(360deg)}}
.b-wave{display:flex;align-items:center;gap:3px;height:24px;flex:none}
.b-wave i{display:block;width:3px;height:6px;border-radius:2px;background:var(--accent)}
.b-wave.is-on i{animation:b-bar .9s ease-in-out infinite alternate}
@keyframes b-bar{from{height:5px}to{height:22px}}

.b-player{position:absolute;z-index:3;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-lg)}
.b-player{gap:8px}
.b-times{display:flex;justify-content:space-between;margin-top:-6px;font:400 12px/16px var(--font-sans);color:var(--ink-muted)}
.b-transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.b-skip{min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule);border-radius:999px;background:var(--paper-raised);color:var(--ink);font:600 14px/20px var(--font-sans);cursor:pointer;transition:background-color .15s,border-color .15s}
.b-skip:hover{border-color:var(--ink-muted)}
.b-skip:active,.b-stop:active,.b-setbtn:active,.b-pill-stop:active{transform:translateY(1px)}
.fr-play.b-play-lg{width:64px;height:64px}
.b-player-row{display:grid;grid-template-columns:64px 1fr auto;gap:8px}
.b-setbtn{min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border:1px solid var(--ink-muted);border-radius:var(--radius-md);background:var(--paper-raised);color:var(--ink-muted);font:600 13px/18px var(--font-sans);cursor:pointer;transition:background-color .15s}
.b-setbtn b{color:var(--ink);font-weight:600}
.b-setbtn:hover,.b-setbtn[aria-expanded="true"]{background:var(--paper);color:var(--ink)}
.b-stop{min-height:44px;display:flex;align-items:center;gap:6px;padding:0 14px;border:1px solid var(--danger);border-radius:var(--radius-md);background:transparent;color:var(--danger);font:600 14px/20px var(--font-sans);cursor:pointer;transition:background-color .15s,color .15s}
.b-stop:hover{background:var(--danger);color:var(--on-accent)}
.b-pill-stop{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--rule);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer;transition:border-color .15s}
.b-pill-stop:hover{border-color:var(--ink-muted)}
.b-skipset{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--rule);border-radius:var(--radius-md);background:var(--paper-raised)}
.b-seg2 .fr-seg{display:grid;grid-template-columns:1fr 1fr;width:100%;box-sizing:border-box}
.b-stepper{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.b-stepbtn{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--ink-muted);border-radius:999px;background:var(--paper);color:var(--ink);cursor:pointer;transition:background-color .15s}
.b-stepbtn:hover{background:var(--paper-raised)}
.b-stepbtn:active{transform:translateY(1px)}
.b-stepbtn[disabled]{opacity:.5;cursor:not-allowed}
.b-stepper-val{text-align:center;font:500 28px/1 var(--font-serif)}
.b-stepper-val small{font:400 14px/1 var(--font-sans);color:var(--ink-muted)}
.b-presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.b-pickbar{position:absolute;z-index:3;left:8px;right:8px;bottom:8px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 4px 4px 16px;background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);font:600 14px/20px var(--font-sans)}
.b-pickbar .fr-btn{color:var(--paper);min-height:44px}
.b-pickbar .fr-btn:hover{background:transparent;text-decoration:underline}
.b-toast{position:absolute;z-index:3;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;padding:8px 4px 8px 16px;background:var(--ink);color:var(--paper);border-radius:var(--radius-lg);font:400 14px/20px var(--font-sans)}
.b-toast .fr-btn{color:var(--paper);min-height:44px;flex:none}
.b-toast .fr-btn:hover{background:transparent;text-decoration:underline}
@media (prefers-reduced-motion:reduce){.b-wave.is-on i,.b-spin,.b-scanline{animation:none}}
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1f5f63"/><circle cx="50" cy="50" r="20" fill="#fffcf5"/><rect x="40" y="46" width="20" height="8" rx="2" fill="#f3dc9a"/></svg></template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/_ds_bundle.js"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="fr-mobile-parts.jsx"></script>
<script type="text/babel" src="fr-bubble.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "shape": "edge",
  "host": "article",
  "autoTuck": false,
  "device": "412"
}/*EDITMODE-END*/;
const DEVICES = { '375': 812, '412': 892, '430': 932 };
function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { document.documentElement.setAttribute('data-theme', t.theme); }, [t.theme]);
  return <>
    <AndroidDevice width={parseInt(t.device, 10)} height={DEVICES[t.device]} bg="var(--paper-raised)" dark={t.theme === 'dark'}>
      <div className="fr m"><BubbleOverlay shape={t.shape} hostId={t.host} autoTuck={t.autoTuck} /></div>
    </AndroidDevice>
    <TweaksPanel>
      <TweakSection label="Bulle" />
      <TweakRadio label="Forme au repos" value={t.shape} options={[{ value: 'edge', label: 'Bulle au bord' }, { value: 'pill', label: 'Pilule en bas' }]} onChange={v => setTweak('shape', v)} />
      <TweakToggle label="Se rétracter après 3 s" value={t.autoTuck} onChange={v => setTweak('autoTuck', v)} />
      <TweakSection label="Contexte" />
      <TweakRadio label="Application dessous" value={t.host} options={[{ value: 'article', label: 'Article' }, { value: 'mail', label: 'Courriel' }]} onChange={v => setTweak('host', v)} />
      <TweakRadio label="Thème" value={t.theme} options={[{ value: 'light', label: 'Papier' }, { value: 'sepia', label: 'Sépia' }, { value: 'dark', label: 'Nuit' }]} onChange={v => setTweak('theme', v)} />
      <TweakRadio label="Largeur" value={t.device} options={[{ value: '375', label: '375' }, { value: '412', label: '412' }, { value: '430', label: '430' }]} onChange={v => setTweak('device', v)} />
    </TweaksPanel>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
