<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FishReader — Mobile</title>
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/fonts.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/colors.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/typography.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/tokens/spacing.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/components/components.css">
<link rel="stylesheet" href="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/styles.css">
<style>
html,body{margin:0;min-height:100%;background:var(--paper)}
body{font-family:var(--font-sans)}
a{color:var(--accent)}a:hover{color:var(--ink)}
#root{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
.m{height:100%;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;--m-read:19px}
.m-scroll{flex:1;min-height:0;overflow:auto;position:relative;scrollbar-width:none}
.m-head{position:sticky;top:0;z-index:2;height:52px;display:flex;align-items:center;gap:8px;padding:0 4px 0 16px;background:var(--paper);border-bottom:1px solid var(--rule)}
.m-head-title{flex:1;min-width:0;margin:0;font:600 20px/24px var(--font-serif);letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-body{padding:16px}
.m-stack{display:flex;flex-direction:column;gap:16px}
.m-tabs{height:60px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);background:var(--paper)}
.m-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--ink-muted);font:600 12px/16px var(--font-sans);cursor:pointer;min-height:48px;transition:color .15s}
.m-tab-ic{width:56px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background-color .15s}
.m-tab:hover .m-tab-ic{background:var(--paper-raised)}
.m-tab:active{transform:translateY(1px)}
.m-tab[aria-current="page"]{color:var(--ink)}
.m-tab[aria-current="page"] .m-tab-ic{background:var(--paper-raised);box-shadow:inset 0 0 0 1px var(--rule);color:var(--accent)}
.m-home{min-height:calc(100% - 52px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px 16px 16px;box-sizing:border-box}
.m-greet{margin:0;font:600 26px/32px var(--font-serif);letter-spacing:-0.01em}
.m-lede{margin:4px 0 0;font:400 15px/22px var(--font-sans);color:var(--ink-muted);text-wrap:pretty}
.m-stack .m-lede{margin:0}
.m .fr-section{margin:24px 0 8px}
.m-doc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;min-height:64px;padding:12px 16px;border:0;border-top:1px solid var(--rule);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:background-color .15s}
.m-doc:first-child{border-top:0}
.m-doc:hover{background:var(--paper)}
.m-doc:active{transform:translateY(1px)}
.m-doc-main{display:flex;flex-direction:column;min-width:0}
.m-doc-title{font:600 15px/22px var(--font-sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-doc-meta{font:400 13px/18px var(--font-sans);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.m-card{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--radius-lg);padding:16px}
.m-quick{display:flex;flex-direction:column;gap:12px}
.m-quick-row{display:flex;align-items:center;gap:12px}
.m-quick-txt{flex:1;min-width:0}
.m-quick-title{margin:0;font:600 15px/22px var(--font-sans)}
.m-quick-sub{margin:4px 0 0;display:flex;align-items:center;gap:8px;font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.m-sep{height:1px;background:var(--rule)}
.m-lbl{display:flex;align-items:baseline;justify-content:space-between;font:600 12px/18px var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.m-num{font:600 14px/20px var(--font-sans);letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums}
.m-full{width:100%}
.m .fr-btn--lg{min-height:48px}
.m-seg5 .fr-seg,.m-seg3 .fr-seg{display:grid;width:100%;box-sizing:border-box}
.m-seg5 .fr-seg{grid-template-columns:repeat(5,1fr)}
.m-seg3 .fr-seg{grid-template-columns:repeat(3,1fr)}
.m .fr-seg button{min-height:44px;padding:0 2px;font-variant-numeric:tabular-nums;transition:background-color .15s,color .15s}
.m .fr-seg button:hover{color:var(--ink)}
.m .fr-seg button:active{transform:translateY(1px)}
.m-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m .fr-chip{min-height:44px;transition:background-color .15s,color .15s}
.m .fr-chip:hover{background:var(--paper)}
.m .fr-chip[aria-pressed="true"]:hover{background:var(--ink)}
.m .fr-chip:active{transform:translateY(1px)}
.m-switch{width:56px;height:44px;flex:none;display:grid;place-items:center;border:0;padding:0;background:transparent;cursor:pointer;border-radius:999px}
.m-switch-track{position:relative;width:52px;height:32px;border-radius:999px;border:1px solid var(--ink-muted);background:var(--paper);box-sizing:border-box;transition:background-color .15s,border-color .15s}
.m-switch-knob{position:absolute;top:50%;left:6px;width:18px;height:18px;margin-top:-9px;border-radius:999px;background:var(--ink-muted);transition:left .15s,width .15s,height .15s,margin .15s,background-color .15s}
.m-switch[aria-checked="true"] .m-switch-track{background:var(--accent);border-color:var(--accent)}
.m-switch[aria-checked="true"] .m-switch-knob{left:24px;width:22px;height:22px;margin-top:-11px;background:var(--on-accent)}
.m-reader-top{display:flex;justify-content:flex-end;padding:12px 16px 0}
.m-reader{padding:8px 20px 40px}
.m .fr-reader-h{font:600 26px/32px var(--font-serif);margin-bottom:24px;text-wrap:pretty}
.m .fr-reader p{font-size:var(--m-read);line-height:1.58}
.m .fr-reader p.fr-reader-kicker{font-size:12px;line-height:18px}
.m-hint,.m-caption{margin:0;font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
.m-player{position:relative;flex:none;height:60px;border-top:1px solid var(--rule);background:var(--paper);display:flex;align-items:center;padding:0 12px}
.m-line{position:absolute;left:0;right:0;top:-1px;height:3px;background:var(--rule)}
.m-line>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.m-line.is-inline{position:relative;top:0;border-radius:999px;overflow:hidden;margin:4px 0 4px}
.m-transport{flex:1;display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:4px}
.m-transport-mid{display:flex;align-items:center;justify-content:center;gap:8px}
.m-time{font:400 13px/18px var(--font-sans);color:var(--ink-muted);font-variant-numeric:tabular-nums}
.m .fr-iconbtn{transition:background-color .15s,color .15s}
.m .fr-iconbtn:active,.m .fr-play:active{transform:translateY(1px)}
.m-speed{justify-self:end;min-width:64px;min-height:44px;border-radius:var(--radius-md);border:1px solid var(--ink-muted);background:var(--paper-raised);color:var(--ink);font:600 14px/20px var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .15s}
.m-speed:hover{background:var(--paper)}
.m-speed:active{transform:translateY(1px)}
.m-sheet{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--paper)}
.m-sheet-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:16px}
.m-ta{flex:1;min-height:160px;resize:none;border:1px solid var(--ink-muted);border-radius:var(--radius-md);background:var(--paper-raised);color:var(--ink);font:400 17px/27px var(--font-serif);padding:12px;box-sizing:border-box}
.m-ta::placeholder{color:var(--ink-muted)}
.m-err{margin:0;font:400 13px/18px var(--font-sans);color:var(--danger)}
.m-sheet-actions{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--rule)}
.m-vwrap{position:relative}
.m-vwrap .fr-voice{width:100%}
.m-sample.fr-iconbtn{position:absolute;right:12px;bottom:12px;border:1px solid var(--ink-muted);border-radius:999px;background:var(--paper-raised);color:var(--ink)}
.m-sample.fr-iconbtn:hover{background:var(--paper)}
.m-speedval{margin:8px 0 0;font:500 44px/1 var(--font-serif);letter-spacing:-0.02em;font-variant-numeric:tabular-nums lining-nums}
.m-range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:44px;margin:4px 0 0;background:transparent;cursor:pointer}
.m-range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--p) 100% no-repeat,var(--rule)}
.m-range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:999px;background:var(--accent);border:3px solid var(--paper-raised);box-sizing:border-box}
.m-range::-moz-range-track{height:6px;border-radius:999px;background:var(--rule)}
.m-range::-moz-range-progress{height:6px;border-radius:999px;background:var(--accent)}
.m-range::-moz-range-thumb{width:22px;height:22px;border-radius:999px;background:var(--accent);border:3px solid var(--paper-raised)}
.m-ticks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.m-ticks button{min-height:44px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--ink-muted);font:600 13px/18px var(--font-sans);font-variant-numeric:tabular-nums;cursor:pointer;transition:background-color .15s,color .15s}
.m-ticks button:hover{background:var(--paper);color:var(--ink)}
.m-ticks button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink-muted)}
.m-ov{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;background:var(--paper)}
.m-ov-note{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px;padding:0 4px 0 16px;background:var(--highlight);color:var(--ink);font:600 13px/18px var(--font-sans)}
.m-ov-note .fr-btn{min-height:44px}
.m-ov-app{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--paper-raised)}
.m-ov-bar{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--rule)}
.m-ov-url{flex:1;min-height:36px;display:flex;align-items:center;padding:0 12px;border-radius:999px;background:var(--paper);color:var(--ink-muted);font:400 13px/18px var(--font-sans)}
.m-ov-article{padding:24px 20px}
.m-ov-h{margin:0 0 16px;font:600 24px/30px var(--font-serif);text-wrap:pretty}
.m-ov-article>p:not(.fr-reader-kicker){margin:0 0 20px;font:400 17px/27px var(--font-serif)}
.m-bubble{position:absolute;z-index:3;width:56px;height:56px;border-radius:999px;border:0;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);cursor:grab;touch-action:none;transition:left .25s,right .25s,top .25s,box-shadow .25s}
.m-bubble:hover{filter:brightness(1.08)}
.m-bubble.is-playing{box-shadow:0 0 0 3px var(--highlight)}
.m-mini{position:absolute;z-index:4;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-lg)}
.m-mini-head{display:flex;align-items:center;gap:12px}
.m-mini-txt{flex:1;min-width:0}
.m-mini-off{gap:8px;padding:16px}
.m-ov-tip{position:absolute;left:16px;right:16px;bottom:16px;margin:0;text-align:center;font:400 13px/18px var(--font-sans);color:var(--ink-muted)}
</style>
</head>
<body>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1f5f63"/><circle cx="50" cy="50" r="20" fill="#fffcf5"/><rect x="40" y="46" width="20" height="8" rx="2" fill="#f3dc9a"/></svg></template>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/fish-reader-studio-design-system-d3e59a52-e505-487f-94f9-89a5c60cf101/_ds_bundle.js"></script>
<script type="text/babel" src="android-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="fr-mobile-parts.jsx"></script>
<script type="text/babel" src="fr-mobile-screens.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "device": "430",
  "readSize": 18
}/*EDITMODE-END*/;
const DEVICES = { '375': 812, '412': 892, '430': 932 };

function FishApp({ readSize }) {
  const [tab, setTab] = React.useState(() => localStorage.getItem('frm-tab') || 'home');
  const [bubbleOn, setBubbleOn] = React.useState(true);
  const [speed, setSpeed] = React.useState(1.25);
  const [voice, setVoice] = React.useState('clara');
  const [timbre, setTimbre] = React.useState('naturel');
  const [docs, setDocs] = React.useState(DOCS);
  const [doc, setDoc] = React.useState(DOCS[0]);
  const [sheet, setSheet] = React.useState(false);
  const [overlay, setOverlay] = React.useState(false);
  const sentences = React.useMemo(() => doc.paragraphs.flat(), [doc]);
  const pb = usePlayback(sentences, speed);
  const init = React.useRef(false);
  React.useEffect(() => { if (!init.current) { init.current = true; pb.load(Math.floor(sentences.length * doc.progress / 100), false); } }, []);
  React.useEffect(() => { localStorage.setItem('frm-tab', tab); }, [tab]);
  React.useEffect(() => { if (pb.active >= 0) { const p = Math.round(pb.active / sentences.length * 100); setDocs(ds => ds.map(d => d.id === doc.id ? { ...d, progress: p } : d)); } }, [pb.active]);
  const open = d => { const s = d.paragraphs.flat(); setDoc(d); pb.load(Math.min(s.length - 1, Math.floor(s.length * (d.progress || 0) / 100)), false); setTab('reader'); };
  const readCustom = txt => {
    const paragraphs = splitText(txt); const t = paragraphs[0][0];
    const d = { id: 'c' + Date.now(), when: 'À l’instant', kicker: 'Texte collé', title: t.length > 48 ? t.slice(0, 46).trim() + '…' : t, progress: 0, paragraphs };
    setDocs(ds => [d, ...ds]); setDoc(d); pb.load(0, true); setSheet(false); setTab('reader');
  };
  return <div className="fr m" style={{ '--m-read': readSize + 'px' }}>
    {tab === 'home' ? <HomeScreen docs={docs} currentId={doc.id} onOpen={open} bubbleOn={bubbleOn} setBubbleOn={setBubbleOn} speed={speed} setSpeed={setSpeed} voice={voice} setVoice={setVoice} onShowBubble={() => setOverlay(true)} /> : null}
    {tab === 'reader' ? <ReaderScreen doc={doc} pb={pb} onPaste={() => setSheet(true)} /> : null}
    {tab === 'voices' ? <VoicesScreen voice={voice} setVoice={setVoice} speed={speed} setSpeed={setSpeed} timbre={timbre} setTimbre={setTimbre} /> : null}
    {tab === 'reader' ? <div className="m-player"><div className="m-line" role="progressbar" aria-label="Progression" aria-valuenow={Math.round(pb.progress)} aria-valuemin="0" aria-valuemax="100"><span style={{ width: pb.progress + '%' }}></span></div><Transport pb={pb} speed={speed} onSpeed={setSpeed} /></div> : null}
    <TabBar tab={tab} onTab={setTab} />
    {sheet ? <PasteSheet onClose={() => setSheet(false)} onRead={readCustom} /> : null}
    {overlay ? <OverlayScreen bubbleOn={bubbleOn} setBubbleOn={setBubbleOn} speed={speed} setSpeed={setSpeed} voice={voice} onExit={() => setOverlay(false)} /> : null}
  </div>;
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { document.documentElement.setAttribute('data-theme', t.theme); }, [t.theme]);
  const w = parseInt(t.device, 10);
  return <>
    <AndroidDevice width={w} height={DEVICES[t.device]} bg="var(--paper)" dark={t.theme === 'dark'}><FishApp readSize={t.readSize} /></AndroidDevice>
    <TweaksPanel>
      <TweakSection label="Thème" />
      <TweakRadio label="Thème" value={t.theme} options={[{ value: 'light', label: 'Papier' }, { value: 'sepia', label: 'Sépia' }, { value: 'dark', label: 'Nuit' }]} onChange={v => setTweak('theme', v)} />
      <TweakSection label="Appareil" />
      <TweakRadio label="Largeur" value={t.device} options={[{ value: '375', label: '375' }, { value: '412', label: '412' }, { value: '430', label: '430' }]} onChange={v => setTweak('device', v)} />
      <TweakSlider label="Texte de lecture" value={t.readSize} min={16} max={24} unit="px" onChange={v => setTweak('readSize', v)} />
    </TweaksPanel>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
